id: imagenet_1k_paper_scale
task_id: imagenet_1k
probe_family: classification
supported_input_spaces: [native, sae_code]
backend: paper_scale_torch
status: draft_recipe
paper_reference:
  source_private_runners:
    native: scripts/benchmarks/run_imagenet_linear_probe.py
    sae_code: scripts/benchmarks/run_imagenet_sae_classification_probe.py
  audit_note: docs/workflow/private_paper_scale_trainer_audit_20260513.md
readout:
  type: linear_classifier
  pooling: mean_patch
  num_classes: 1000
transform:
  mode: shared_imagenet
  resize_size: 256
  crop_size: 224
training:
  epochs: 20
  batch_size: 512
  feature_batch_size: 32
  sae_batch_size: 2048
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  seed: 42
selection:
  checkpoint_rule: best_validation_top1
metrics:
  primary: top1
  report: [top1, top5, loss]
ranking:
  available_for_sae_code: true
  default_method: hybrid
  source: hybrid_probe_weight_plus_val_contribution
outputs:
  summary: summary.json
  checkpoint: probe.pt
  probe_outputs: probe_outputs.npz
  ranking: task_feature_ranking.json
notes:
  - Native private runner defaults to native transforms, but paper inventory uses shared_imagenet.
  - Public port should expose transform mode explicitly rather than hiding this distinction.
