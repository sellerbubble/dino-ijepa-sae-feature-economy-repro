id: clevr_count_paper_scale
task_id: clevr_count
probe_family: count_classification
supported_input_spaces: [native, sae_code]
backend: paper_scale_torch
status: draft_recipe
paper_reference:
  source_private_runners:
    native: scripts/benchmarks/run_clevr_count_probe.py
    sae_code: scripts/benchmarks/run_clevr_count_sae_probe.py
  audit_note: docs/workflow/private_paper_scale_trainer_audit_20260513.md
readout:
  type: linear_classifier
  pooling: mean_patch
  num_classes: 8
labels:
  source: scene_annotations
  rule: label = object_count - 3
transform:
  mode: shared_imagenet
  resize_size: 256
  crop_size: 224
training:
  epochs: 20
  batch_size: 512
  feature_batch_size: 32
  sae_batch_size: 2048
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  seed: 42
selection:
  checkpoint_rule: best_validation_accuracy
metrics:
  primary: accuracy
  report: [accuracy, loss]
ranking:
  available_for_sae_code: true
  default_method: hybrid
  source: hybrid_probe_weight_plus_val_contribution
outputs:
  summary: summary.json
  checkpoint: probe.pt
  probe_outputs: probe_outputs.npz
  ranking: task_feature_ranking.json
notes:
  - CLEVR/Count is image-only object counting, not question-conditioned counting.
  - Preserve the stored-best versus recomputed E2 baseline distinction for I-JEPA reports.
