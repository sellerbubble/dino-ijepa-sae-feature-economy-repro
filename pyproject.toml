[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-economy-repro"
version = "0.0.0"
description = "Public reproduction tools for DINO/I-JEPA SAE Feature Economy experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
experiments = [
  "pillow",
  "torch",
  "torchvision",
  "transformers",
  "tqdm",
]
figures = [
  "matplotlib",
]

[project.scripts]
feature-economy = "feature_economy.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
